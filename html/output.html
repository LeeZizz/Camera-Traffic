<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Streams</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <style>
      /* CSS cho camera container */
      .camera-container {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        /* 6 cột */
        grid-template-rows: repeat(4, 1fr);
        /* 4 hàng */
        gap: 20px;
        /* Khoảng cách giữa các ảnh */
        padding: 20px;
        /* Padding để cách lề ngoài */
        height: auto;
        /* Đổi thành auto để tự điều chỉnh chiều cao theo nội dung */
        margin-bottom: 10px;
        /* Giữ khoảng cách với pagination */
      }
    </style>
  </head>

  <body>
    <!-- Thanh sidebar -->
    <div class="sidebar">
      <h3 class="camera-home-title">
        <img
          src="https://cdn-icons-png.flaticon.com/128/4269/4269808.png"
          alt="Camera Icon"
          class="sidebar-icon"
        />
        Camera Home
      </h3>
      <a href="index.html">
        <img
          src="https://cdn-icons-png.flaticon.com/128/8899/8899687.png"
          alt="Dashboard Icon"
          class="sidebar-icon"
        />
        Dashboard
      </a>
      <a href="channels.html">
        <img
          src="https://cdn-icons-png.flaticon.com/128/2818/2818072.png"
          alt="Channels Icon"
          class="sidebar-icon"
        />
        Channels
      </a>
      <a href="groups.html">
        <img
          src="https://cdn-icons-png.flaticon.com/128/4144/4144517.png"
          alt="Groups Icon"
          class="sidebar-icon"
        />
        Groups
      </a>
      <a href="output.html">
        <img
          src="https://cdn-icons-png.flaticon.com/128/3488/3488340.png"
          alt="Output Icon"
          class="sidebar-icon"
        />
        Output
      </a>
      <a href="#">
        <img
          src="https://cdn-icons-png.flaticon.com/128/675/675729.png"
          alt="Settings Icon"
          class="sidebar-icon"
        />
        Settings
      </a>
      <hr class="divider" />
      <a href="#">
        <img
          src="https://cdn-icons-png.flaticon.com/128/14993/14993522.png"
          alt="Logout Icon"
          class="sidebar-icon"
        />
        Logout
      </a>
    </div>

    <!-- Nội dung chính -->
    <div class="content">
      <!-- Thanh search -->
      <div class="topbar">
        <div class="search-container">
          <img
            src="https://cdn-icons-png.flaticon.com/128/16020/16020060.png"
            alt="Custom Icon"
            class="custom-search-icon"
          />
          <input type="text" class="form-control" placeholder="Search" />
        </div>
        <div class="admin-container">
          <img
            src="https://cdn-icons-png.flaticon.com/128/4814/4814852.png"
            alt="Avatar"
            class="avatar"
          />
          <button class="btn btn-dark admin-btn">
            Hello, Thắng
            <img
              src="https://cdn-icons-png.flaticon.com/128/10255/10255622.png"
              alt="Triangle Icon"
            />
          </button>
        </div>
      </div>

      <!-- Thanh mới (Screenshots) -->
      <div class="screenshot-bar">
        <span class="screenshot-title">Screenshots</span>
        <span class="screenshot-description"
          >Những bức ảnh screenshot của các camera trên đường phố</span
        >
        <button class="screenshot-btn download-btn">
          <img
            src="https://cdn-icons-png.flaticon.com/128/2550/2550364.png"
            alt="Download Icon"
          />
          Image Downloader
        </button>
        <button class="screenshot-btn resize-btn">
          <img
            src="https://cdn-icons-png.flaticon.com/128/1375/1375106.png"
            alt="Resize Icon"
          />
          Image Resizer
        </button>
        <button class="screenshot-btn remove-btn">
          <img
            src="https://cdn-icons-png.flaticon.com/128/8997/8997755.png"
            alt="Remove Icon"
          />
          Remove Noisy Object
        </button>
      </div>
      <!-- Phần chứa 24 ảnh -->
      <div class="camera-container">
        <!-- Nội dung sẽ được JavaScript tự động điền vào đây -->
      </div>

      <!-- Phân trang -->
      <div class="pagination">
        <a href="#" class="page-link">Previous</a> |
        <span class="page-info">Page 4 of 96</span> |
        <a href="#" class="page-link">Next</a>
      </div>

      <!-- Thanh thông tin -->
      <div class="info-bar">
        <div class="info-content">
          <span>Nhóm Vippro</span>
          <div class="links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms and conditions</a>
            <a href="#">Contact</a>
            <a href="#">Apps</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../assets/js/scripts.js"></script>
  </body>
</html>
