<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Streams</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>

  <body>
    <!-- Thanh sidebar -->
    <div class="sidebar">
      <h3 class="camera-home-title">
        <img
          src="https://cdn-icons-png.flaticon.com/128/4269/4269808.png"
          alt="Camera Icon"
          class="sidebar-icon"
        />
        Camera Home
      </h3>
      <a href="index.html">
        <img
          src="https://cdn-icons-png.flaticon.com/128/8899/8899687.png"
          alt="Dashboard Icon"
          class="sidebar-icon"
        />
        Dashboard
      </a>
      <a href="channels.html">
        <img
          src="https://cdn-icons-png.flaticon.com/128/2818/2818072.png"
          alt="Channels Icon"
          class="sidebar-icon"
        />
        Channels
      </a>
      <a href="groups.html">
        <img
          src="https://cdn-icons-png.flaticon.com/128/4144/4144517.png"
          alt="Groups Icon"
          class="sidebar-icon"
        />
        Groups
      </a>
      <a href="output.html">
        <img
          src="https://cdn-icons-png.flaticon.com/128/3488/3488340.png"
          alt="Output Icon"
          class="sidebar-icon"
        />
        Output
      </a>
      <a href="#">
        <img
          src="https://cdn-icons-png.flaticon.com/128/675/675729.png"
          alt="Settings Icon"
          class="sidebar-icon"
        />
        Settings
      </a>
      <hr class="divider" />
      <a href="#">
        <img
          src="https://cdn-icons-png.flaticon.com/128/14993/14993522.png"
          alt="Logout Icon"
          class="sidebar-icon"
        />
        Logout
      </a>
    </div>

    <!-- Nội dung chính -->
    <div class="content">
      <!-- Thanh search -->
      <div class="topbar">
        <div class="search-container">
          <img
            src="https://cdn-icons-png.flaticon.com/128/16020/16020060.png"
            alt="Custom Icon"
            class="custom-search-icon"
          />
          <input type="text" class="form-control" placeholder="Search" />
        </div>
        <div class="admin-container">
          <img
            src="https://cdn-icons-png.flaticon.com/128/4814/4814852.png"
            alt="Avatar"
            class="avatar"
          />
          <button class="btn btn-dark admin-btn">
            Hello, Thắng
            <img
              src="https://cdn-icons-png.flaticon.com/128/10255/10255622.png"
              alt="Triangle Icon"
            />
          </button>
        </div>
      </div>

      <!-- Thanh điều khiển mới (CCTV Control Room) -->
      <div class="control-bar">
        <span class="control-title">CCTV Control Room</span>
        <span class="control-description"
          >Kênh group các camera trên đường phố</span
        >
        <button class="control-btn reload-btn">
          <img
            src="https://cdn-icons-png.flaticon.com/128/16323/16323609.png"
            alt="Reload Icon"
          />
          Reload
        </button>
        <button class="control-btn stop-btn">
          <img
            src="https://cdn-icons-png.flaticon.com/128/438/438970.png"
            alt="Stop Icon"
          />
          Stop
        </button>
      </div>

      <!-- Phần chứa 6 camera stream -->
      <div class="camera-container" style="margin-bottom: 30px">
        <div class="stream-wrapper">
          <h3 class="stream-header">Camera 1</h3>
          <div class="stream">
            <img
              id="camera1"
              src="../picture/unnamed.png"
              alt="Camera 1 Feed"
              class="img-fluid camera-feed"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 8px;
              "
            />
          </div>
        </div>
        <div class="stream-wrapper">
          <h3 class="stream-header">Camera 2</h3>
          <div class="stream">
            <img
              id="camera2"
              src="../picture/unnamed.png"
              alt="Camera 2 Feed"
              class="img-fluid camera-feed"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 8px;
              "
            />
          </div>
        </div>
        <div class="stream-wrapper">
          <h3 class="stream-header">Camera 3</h3>
          <div class="stream">
            <img
              id="camera3"
              src="../picture/unnamed.png"
              alt="Camera 3 Feed"
              class="img-fluid camera-feed"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 8px;
              "
            />
          </div>
        </div>
        <div class="stream-wrapper">
          <h3 class="stream-header">Camera 4</h3>
          <div class="stream">
            <img
              id="camera4"
              src="../picture/unnamed.png"
              alt="Camera 4 Feed"
              class="img-fluid camera-feed"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 8px;
              "
            />
          </div>
        </div>
        <div class="stream-wrapper">
          <h3 class="stream-header">Camera 5</h3>
          <div class="stream">
            <img
              id="camera5"
              src="../picture/unnamed.png"
              alt="Camera 5 Feed"
              class="img-fluid camera-feed"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 8px;
              "
            />
          </div>
        </div>
        <div class="stream-wrapper">
          <h3 class="stream-header">Camera 6</h3>
          <div class="stream">
            <img
              id="camera6"
              src="../picture/unnamed.png"
              alt="Camera 6 Feed"
              class="img-fluid camera-feed"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 8px;
              "
            />
          </div>
        </div>
      </div>

      <!-- Phân trang -->
      <div class="pagination">
        <a href="#" class="page-link">Previous</a> |
        <span class="page-info">Page 4 of 96</span> |
        <a href="#" class="page-link">Next</a>
      </div>

      <!-- Thanh thông tin -->
      <div class="info-bar">
        <div class="info-content">
          <span>Nhóm 4</span>
          <div class="links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms and conditions</a>
            <a href="#">Contact</a>
            <a href="#">Apps</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../assets/js/scripts.js"></script>
  </body>
</html>
